<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <script src="calculadora.js"></script>
</head>

<body>
    <div class="container">
        <h1> Calculadora de IMC</h1>
        <label for="peso"> Peso (em Kg)</label>
        <input type="number" id="Peso" placeholder="Digite aqui seu peso" required>
        <label for="altura"> Altura (em M)</label>
        <input type="number" id="Altura" placeholder="Digite aqui sua altura" required>

        <button onclick="calcularImc()" id="calcular">Calcular IMC</button>

        <p id="ResultadoIMC"></p>

    </div>

</body>

</html>
